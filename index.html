<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easter Egg Hunt</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game-container"></div>
  
  <div id="ui-container">
    <div class="panel" id="leaderboard">
      <h3>Egg Hunt Leaderboard</h3>
      <div id="leaderboard-content"></div>
    </div>
  </div>
  
  <div id="egg-creator" class="panel">
    <h3>Create an Easter Egg</h3>
    <input type="text" id="egg-prompt" placeholder="Describe your egg texture" style="width: 100%; padding: 8px; margin-bottom: 10px;">
    <button id="generate-texture-btn" class="btn">Generate Texture</button>
    <div id="egg-preview">
      <span>Your egg texture will appear here</span>
    </div>
    <button id="save-egg-btn" class="btn" style="margin-top: 10px; display: none;">Save Egg</button>
    <button id="cancel-egg-btn" class="btn" style="margin-top: 10px; background-color: #f44336;">Cancel</button>
  </div>
  
  <button id="create-egg-btn" class="btn">Create Egg</button>
  <button id="hide-egg-btn" class="btn">Hide Egg</button>
  
  <div id="notification"></div>

  <!-- Load modules in the correct order -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/worldBuilder.js"></script>
  <script type="module" src="js/eggCreator.js"></script>
  <script type="module" src="js/eggPlacement.js"></script>
  <script type="module" src="js/uiController.js"></script>
  <script type="module" src="js/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
